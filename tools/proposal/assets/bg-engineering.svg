<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"
     preserveAspectRatio="xMidYMid slice" role="presentation" aria-hidden="true">
  <!--
    Fundo temático da Angatu Sistemas — variante desktop.

    Vocabulário: planta técnica (grade de cotas, marcas de dimensão, marcas de
    registro nas quinas), topologia de rede (o trio de nós do próprio escudo,
    roteado como trilha de placa) e grade de dados isométrica.

    Cores: só tokens do MASTER. tinta no papel, azul-claro e marinho-claro
    no traço, sempre abaixo de 22% de opacidade — nada aqui pode competir com o
    conteúdo que passa por cima.

    Nada é nó repetido: grade por <pattern>, motivo por <use>.
    A variante mobile (bg-engenharia-mobile.svg) NÃO é esta encolhida: tem menos
    elementos, passo maior e traço mais grosso, senão vira ruído cinza a 375 px.
  -->
  <defs>
    <!-- grade fina: o papel milimetrado da prancha -->
    <pattern id="fina" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#9FBEE4" stroke-width=".8" stroke-opacity=".11"/>
    </pattern>
    <!-- grade grossa: a divisão de cotas a cada 240 -->
    <pattern id="grossa" width="240" height="240" patternUnits="userSpaceOnUse">
      <path d="M240 0H0v240" fill="none" stroke="#9FBEE4" stroke-width="1.6" stroke-opacity=".16"/>
    </pattern>
    <!-- grade de dados isométrica -->
    <pattern id="iso" width="48" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 14 24 0 48 14 24 28Z" fill="none" stroke="#9FBEE4" stroke-width=".7"
            stroke-opacity=".5"/>
    </pattern>

    <!--
      O trio de nos do escudo, na proporcao MEDIDA no arquivo oficial da marca
      e nao no olho: traco 13,3 - bola r 17 - hastes em x 48 / 95 / 142,5 -
      bolas em y 57,5 (centro) e 90 (laterais), no escudo de 190 px de largura.
      A primeira versao usava bola com raio de 2,8 vezes o traco; a real e 1,28,
      e a diferenca fazia o motivo ler como pirulito em vez de circuito.
      Largura util 190, altura 205.
    -->
    <g id="trio" fill="none" stroke="currentColor" stroke-width="13.3" stroke-linecap="round"
       stroke-linejoin="round">
      <path d="M95 57.5V205"/>
      <path d="M48 90v22l24 26v67"/>
      <path d="M142.5 90v22l-24 26v67"/>
      <circle cx="95" cy="57.5" r="17" fill="currentColor" stroke="none"/>
      <circle cx="48" cy="90" r="17" fill="currentColor" stroke="none"/>
      <circle cx="142.5" cy="90" r="17" fill="currentColor" stroke="none"/>
    </g>

    <!-- marca de dimensão: linha de cota com ponta e limites -->
    <g id="cota" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
       stroke-linejoin="round">
      <path d="M0 0v18M200 0v18M0 9h200M9 5 0 9l9 4M191 5l9 4-9 4"/>
    </g>

    <!-- marca de registro de prancha, nas quinas -->
    <g id="registro" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M0 22h44M22 0v44"/>
      <circle cx="22" cy="22" r="12"/>
    </g>

    <!-- nó de junção de trilha, para os cruzamentos -->
    <g id="juncao" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M0 0h56l40 40h64"/>
      <circle cx="56" cy="0" r="5" fill="currentColor" stroke="none"/>
      <circle cx="160" cy="40" r="5" fill="currentColor" stroke="none"/>
    </g>
  </defs>

  <!-- papel -->
  <rect width="1600" height="1000" fill="#051D38"/>
  <rect width="1600" height="1000" fill="url(#fina)"/>
  <rect width="1600" height="1000" fill="url(#grossa)"/>

  <!-- grade de dados: duas manchas isométricas, nas quinas opostas -->
  <g opacity=".2">
    <rect x="-10" y="690" width="520" height="320" fill="url(#iso)"/>
    <rect x="1180" y="-10" width="430" height="250" fill="url(#iso)"/>
  </g>

  <!-- topologia de rede: o escudo virando circuito, em três escalas -->
  <g color="#9FBEE4">
    <use href="#trio" transform="translate(1204 128) scale(.52)" opacity=".16"/>
    <use href="#trio" transform="translate(148 322) scale(.34)" opacity=".12"/>
    <use href="#trio" transform="translate(1066 664) scale(.30)" opacity=".12"/>
    <use href="#trio" transform="translate(402 836) scale(.40)" opacity=".13"/>
    <use href="#trio" transform="translate(738 182) scale(.26)" opacity=".10"/>
  </g>

  <!-- trilhas ligando as regiões, sempre em 45° ou 90°, como placa de verdade -->
  <g color="#115BB1" opacity=".32">
    <use href="#juncao" x="300" y="180"/>
    <use href="#juncao" x="820" y="330" transform="scale(-1,1)" transform-origin="820 330"/>
    <use href="#juncao" x="640" y="720"/>
    <use href="#juncao" x="1300" y="480" transform="scale(-1,1)" transform-origin="1300 480"/>
  </g>

  <!-- cotas de prancha -->
  <g color="#9FBEE4" opacity=".26">
    <use href="#cota" x="80" y="90"/>
    <use href="#cota" x="1260" y="900"/>
    <use href="#cota" x="700" y="480" transform="rotate(90 700 480)"/>
  </g>

  <!-- registro nas quatro quinas -->
  <g color="#9FBEE4" opacity=".3">
    <use href="#registro" x="76" y="76"/>
    <use href="#registro" x="1480" y="76"/>
    <use href="#registro" x="76" y="880"/>
    <use href="#registro" x="1480" y="880"/>
  </g>
</svg>
