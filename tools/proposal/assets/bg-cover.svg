<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!-- Cover background built from the vocabulary of bg-engineering.svg: the same blueprint
       grids and the shield's three-node motif, placed where the cover content leaves room. -->
  <defs>
    <pattern id="fina" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0v30" fill="none" stroke="#9FBEE4" stroke-width=".8" stroke-opacity=".10"/>
    </pattern>
    <pattern id="grossa" width="180" height="180" patternUnits="userSpaceOnUse" x="37" y="37">
      <path d="M180 0H0v180" fill="none" stroke="#9FBEE4" stroke-width="1.4" stroke-opacity=".15"/>
    </pattern>
    <g id="trio" fill="none" stroke="currentColor" stroke-width="13.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M95 57.5V205"/>
      <path d="M48 90v22l24 26v67"/>
      <path d="M142.5 90v22l-24 26v67"/>
      <circle cx="95" cy="57.5" r="17" fill="currentColor" stroke="none"/>
      <circle cx="48" cy="90" r="17" fill="currentColor" stroke="none"/>
      <circle cx="142.5" cy="90" r="17" fill="currentColor" stroke="none"/>
    </g>
  </defs>
  <rect width="794" height="1123" fill="#051D38"/>
  <rect width="794" height="1123" fill="url(#fina)"/>
  <rect width="794" height="1123" fill="url(#grossa)"/>
  <g color="#9FBEE4">
    <use href="#trio" transform="translate(612 132) scale(.42)" opacity=".14"/>
    <use href="#trio" transform="translate(664 846) scale(.30)" opacity=".12"/>
  </g>
</svg>
